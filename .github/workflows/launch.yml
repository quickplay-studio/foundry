name: launch

on:
  push:
    paths:
      - "ventures/*/idea.json"
  workflow_dispatch:
    inputs:
      slug:
        description: "venture slug under ventures/, or all"
        required: false
        default: all

permissions:
  contents: write

concurrency:
  group: launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Launch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          SLUG="${{ github.event.inputs.slug || 'all' }}"
          if [ "$SLUG" = "all" ]; then
            python -m foundry.launch --all
          else
            python -m foundry.launch --slug "$SLUG"
          fi

      - name: Commit
        run: |
          git config user.name "Foundry Bot"
          git config user.email "foundry@users.noreply.github.com"
          git add ventures
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "launch: $(git diff --cached --name-only | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          git pull --rebase
          git push
