<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a radial map of the workforce on the left, a detail panel on the right; stacks on a phone. Dark by choice: a foundry floor at night, brass and ink. */
:root {
  --bg: #101317; --panel: #171c22; --line: #2a323c; --fg: #ece7dd; --muted: #9aa3ad; --accent: #e8a24a; --accent-ink: #1a1206;
  --ok: #7fd1a8; --warn: #e8d35a; --human: #e06c6c;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); padding-block: 18px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--accent); }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; max-width: 1180px; margin: 0 auto 14px; }
header h1 { font: 700 34px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
header .sub { color: var(--muted); font-size: 14px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 16px; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 500; }
.wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; max-width: 1180px; margin: 0 auto; }
@media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.map { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-width: 0; }
.map svg { width: 100%; height: auto; max-width: 100%; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 2px 8px; }
.chip { font: 600 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 7px 10px; border-radius: 3px; cursor: pointer; }
.chip:hover { color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:focus-visible, .job:focus-visible, .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.panel h2 { font: 700 28px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 4px; text-wrap: balance; }
.panel .tag { font: 500 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.panel p { margin: 10px 0 0; max-width: 62ch; }
.fnlist { display: grid; gap: 14px; margin-top: 16px; }
.fn h3 { font: 600 13px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.jobs { display: grid; gap: 4px; }
.job { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 6px 8px; color: var(--fg); cursor: pointer; font: inherit; }
.job:hover { border-color: var(--line); }
.job[aria-current="true"] { border-color: var(--accent); background: rgba(232,162,74,.08); }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.auto { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.detail { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 10px 0 0; font-size: 14px; }
.detail dt { font: 600 12px/1.6 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.detail code { font-family: var(--mono); font-size: 12.5px; }
.status { display: inline-block; font: 600 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.status.ready { color: var(--ok); border-color: var(--ok); }
.back { background: transparent; border: 0; color: var(--accent); font: inherit; padding: 0; cursor: pointer; margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 6px 2px 0; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--c); }
svg text { font-family: var(--display); fill: var(--fg); }
svg .lbl { font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
svg .cnt { font-size: 11px; fill: var(--muted); font-family: var(--mono); }
svg .dept { cursor: pointer; }
svg .dept:hover circle.core { stroke-width: 3; }
svg .jobdot { cursor: pointer; transition: r .15s; }
svg .jobdot.dim { opacity: .18; }
svg .jobdot.sel { stroke: var(--fg); stroke-width: 2; }
svg .spoke { stroke: var(--line); stroke-width: 1; }
svg .arm { stroke-width: 1; opacity: .55; }
svg .twig { stroke-width: 1; opacity: .45; }
@media (prefers-reduced-motion: reduce) { svg .jobdot { transition: none; } }
</style>

      f.jobs.forEach(function (j, k) {
        var ja = cursor + w * (k + 0.5) / f.jobs.length, jp = pol(R3, ja);
        g.appendChild(svgEl("line", { class: "twig", x1: fp[0], y1: fp[1], x2: jp[0], y2: jp[1], stroke: d.colour }));
        var r = j.autonomy === "solo" ? 4 : 3;
        var dot = svgEl("circle", { class: "jobdot", "data-job": j.id, cx: jp[0], cy: jp[1], r: r, fill: j.autonomy === "human" ? "none" : d.colour, stroke: d.colour, "stroke-width": j.autonomy === "human" ? 1.5 : 0 });
        if (j.autonomy === "assisted") dot.setAttribute("fill-opacity", "0.5");
        dot.addEventListener("click", function (ev) { ev.stopPropagation(); select(d.id, j.id); });
        g.appendChild(dot);
      });
      cursor += w;
    });
    g.appendChild(svgEl("circle", { class: "core", cx: c[0], cy: c[1], r: 11, fill: "var(--panel)", stroke: d.colour, "stroke-width": 2 }));
    var lp = pol(R4 + 18, mid), anchor = Math.cos(mid) > 0.3 ? "start" : Math.cos(mid) < -0.3 ? "end" : "middle";
    var t = svgEl("text", { class: "lbl", x: lp[0], y: lp[1] + 5, "text-anchor": anchor, fill: d.colour }); t.textContent = d.title; g.appendChild(t);
    var t2 = svgEl("text", { class: "cnt", x: lp[0], y: lp[1] + 19, "text-anchor": anchor }); t2.textContent = jobs + " jobs"; g.appendChild(t2);
    g.addEventListener("click", function () { select(d.id, null); });
    g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(d.id, null); } });
    svg.appendChild(g);
  });
  svg.appendChild(svgEl("circle", { cx: CX, cy: CY, r: 46, fill: "var(--accent)", opacity: ".12" }));
  svg.appendChild(svgEl("circle", { cx: CX, cy: CY, r: 30, fill: "var(--accent)" }));
  var b1 = svgEl("text", { x: CX, y: CY + 2, "text-anchor": "middle", class: "lbl", fill: "var(--accent-ink)", "font-size": "12" }); b1.textContent = "SECOND"; svg.appendChild(b1);
  var b2 = svgEl("text", { x: CX, y: CY + 14, "text-anchor": "middle", class: "lbl", fill: "var(--accent-ink)", "font-size": "12" }); b2.textContent = "BRAIN"; svg.appendChild(b2);
  var cen = svgEl("circle", { cx: CX, cy: CY, r: 46, fill: "transparent", style: "cursor:pointer" }); cen.addEventListener("click", function () { select(null, null); }); svg.appendChild(cen);
}

function applyStage() {
  var dots = document.querySelectorAll(".jobdot");
  for (var i = 0; i < dots.length; i++) {
    var j = jobsById[dots[i].getAttribute("data-job")];
    dots[i].classList.toggle("dim", !!state.stage && j.stage !== state.stage);
    dots[i].classList.toggle("sel", state.job === j.id);
  }
}

function renderChips() {
  var box = document.getElementById("stagechips"); box.innerHTML = "";
  ["all"].concat(STAGES).forEach(function (s) {
    var b = el("button", "chip", s); b.type = "button"; b.setAttribute("aria-pressed", String((state.stage || "all") === s));
    b.title = s === "all" ? "Every job" : DATA.stages[s];
    b.addEventListener("click", function () { state.stage = s === "all" ? null : s; renderChips(); applyStage(); renderPanel(); });
    box.appendChild(b);
  });
}

function renderLegend() {
  var lg = document.getElementById("legend"); lg.innerHTML = "";
  [["solo", "var(--ok)"], ["assisted, half filled", "var(--warn)"], ["human, outline only", "var(--human)"]].forEach(function (p) { var s = el("span", null, p[0]); s.style.setProperty("--c", p[1]); lg.appendChild(s); });
  var e = el("span", null, "filter by stage with the chips; the centre is the brain every job reads first"); e.style.setProperty("--c", "var(--accent)"); lg.appendChild(e);
}

function renderStats() {
  var all = Object.keys(jobsById).map(function (k) { return jobsById[k]; });
  var ready = all.filter(function (j) { return j.status === "ready"; }).length;
  var solo = all.filter(function (j) { return j.autonomy === "solo"; }).length;
  var s = document.getElementById("stats"); s.innerHTML = "";
  [[all.length, "jobs"], [DATA.departments.length, "departments"], [solo, "run solo"], [ready, "ready"]].forEach(function (p) { var e = el("span"); var b = el("b", null, String(p[0])); e.appendChild(b); e.appendChild(document.createTextNode(" " + p[1])); s.appendChild(e); });
}

function renderPanel() {
  var p = document.getElementById("panel"); p.innerHTML = "";
  if (!state.dept) {
    p.appendChild(el("h2", null, "Second brain"));
    p.appendChild(el("span", "tag", "the centre of the tree"));
    p.appendChild(el("p", null, DATA.centre.summary));
    var ul = el("div", "fnlist");
    STAGES.forEach(function (s) { var f = el("div", "fn"); f.appendChild(el("h3", null, s)); f.appendChild(el("p", null, DATA.stages[s])).style.marginTop = "0"; ul.appendChild(f); });
    p.appendChild(ul);
    return;
  }
  var d = deptById[state.dept];
  var back = el("button", "back", "All departments"); back.type = "button"; back.addEventListener("click", function () { select(null, null); }); p.appendChild(back);
  p.appendChild(el("h2", null, d.title)); p.appendChild(el("span", "tag", d.tagline + (d.stage ? " · stage: " + d.stage : "")));
  if (d.note) p.appendChild(el("p", null, d.note));
  var list = el("div", "fnlist");
  d.functions.forEach(function (f) {
    var box = el("div", "fn"); box.appendChild(el("h3", null, f.title));
    var jobs = el("div", "jobs");
    f.jobs.forEach(function (j) {
      if (state.stage && j.stage !== state.stage) return;
      var b = el("button", "job"); b.type = "button"; b.setAttribute("aria-current", String(state.job === j.id));
      var dot = el("span", "dot"); dot.style.background = j.autonomy === "human" ? "transparent" : d.colour; dot.style.border = "1.5px solid " + d.colour; if (j.autonomy === "assisted") dot.style.opacity = ".55";
      b.appendChild(dot); b.appendChild(el("span", null, j.title)); b.appendChild(el("span", "auto", j.autonomy));
      b.addEventListener("click", function () { select(d.id, j.id); });
      jobs.appendChild(b);
    });
    if (jobs.children.length) { box.appendChild(jobs); list.appendChild(box); }
  });
  p.appendChild(list);
  if (state.job) {
    var j = jobsById[state.job], det = el("div", "detail");
    det.appendChild(el("h2", null, j.title));
    var st = el("span", "status " + (j.status || "stub"), j.status || "stub"); det.appendChild(st);
    det.appendChild(el("p", null, j.summary));
    var dl = el("dl");
    [["id", j.id, true], ["autonomy", j.autonomy + ": " + DATA.autonomy[j.autonomy]], ["stage", j.stage ? j.stage + ": " + DATA.stages[j.stage] : "not part of a launch"],
     ["builds on", j.builds_on.length ? j.builds_on.map(function (b) { return jobsById[b] ? jobsById[b].title : b; }).join(", ") : "nothing"],
     ["skill file", "departments/" + j.department + "/" + j.function + "/" + j.id + "/SKILL.md", true]].forEach(function (row) {
      dl.appendChild(el("dt", null, row[0])); var dd = el("dd"); if (row[2]) { var c = el("code", null, row[1]); dd.appendChild(c); } else dd.textContent = row[1]; dl.appendChild(dd);
    });
    det.appendChild(dl); p.appendChild(det);
    det.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

function select(dept, job) {
  state.dept = dept; state.job = job;
  var h = job ? job : dept ? dept : "";
  if (h && location.hash.slice(1) !== h) { try { history.replaceState(null, "", "#" + h); } catch (e) {} }
  applyStage(); renderPanel();
}
function fromHash() {
  var h = location.hash.slice(1);
  if (jobsById[h]) select(jobsById[h].department, h); else if (deptById[h]) select(h, null); else select(null, null);
}
drawMap(); renderChips(); renderLegend(); renderStats(); fromHash();
window.addEventListener("hashchange", fromHash);
</script>
