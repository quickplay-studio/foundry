name: jobs

# Daily: launch any venture that has an idea.json but no board, then run up to
# five ready GitHub jobs across ventures in plan order. Same private data
# checkout as launch.yml; see the note there.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "venture slug, or all"
        required: false
        default: all
      job:
        description: "one job id, or blank for the next ones in plan order"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: foundry
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the data repo token
        env:
          T: ${{ secrets.VENTURES_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::VENTURES_TOKEN is not set on this repo (Settings, Secrets and variables, Actions). Add a fine-grained token with Contents read and write on quickplay-studio/foundry-ventures."
            exit 1
          fi
          who=$(curl -s -H "Authorization: Bearer $T" https://api.github.com/user | python3 -c "import sys,json; print(json.load(sys.stdin).get('login','unknown'))" 2>/dev/null || echo unknown)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/repos/quickplay-studio/foundry-ventures)
          echo "token owner: $who, GET foundry-ventures: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::VENTURES_TOKEN (owner $who) cannot see quickplay-studio/foundry-ventures (HTTP $code). Edit the token: Repository access, Only select repositories, tick foundry-ventures; Permissions, Contents: Read and write."
            exit 1
          fi

      - name: Check out venture data (private)
        uses: actions/checkout@v4
        with:
          repository: quickplay-studio/foundry-ventures
          token: ${{ secrets.VENTURES_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Free model router (FreeLLMAPI on the runner, fails open)
        uses: ./.github/actions/freellm
        continue-on-error: true
        with:
          tavily: ${{ secrets.TAVILY_API_KEY }}
          exa: ${{ secrets.EXA_API_KEY }}
          firecrawl: ${{ secrets.FIRECRAWL_API_KEY }}
          linkup: ${{ secrets.LINKUP_API_KEY }}
          ollama: ${{ secrets.OLLAMA_API_KEY }}
          llm7: ${{ secrets.LLM7_API_KEY }}

      - name: Run jobs
        env:  # every one optional; a missing key skips that step and logs it
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SUPPORT_IMAP_USER: ${{ secrets.SUPPORT_IMAP_USER }}
          SUPPORT_IMAP_PASSWORD: ${{ secrets.SUPPORT_IMAP_PASSWORD }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          CALCOM_API_KEY: ${{ secrets.CALCOM_API_KEY }}
          CALCOM_BOOKING_URL: ${{ secrets.CALCOM_BOOKING_URL }}
          FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          DEAL_ROOM_PING_URL: ${{ secrets.DEAL_ROOM_PING_URL }}
        run: |
          python -m foundry.launch --all
          SLUG="${{ github.event.inputs.slug || 'all' }}"
          JOB="${{ github.event.inputs.job }}"
          if [ "$SLUG" = "all" ]; then
            python -m foundry.jobs --all
          elif [ -n "$JOB" ]; then
            python -m foundry.jobs --slug "$SLUG" --job "$JOB"
          else
            python -m foundry.jobs --slug "$SLUG"
          fi
          python -m foundry.dashboards

      - name: Router stats, then stop it
        if: ${{ always() }}
        uses: ./.github/actions/freellm
        continue-on-error: true
        with: { mode: stats }

      - name: Commit venture data
        working-directory: data
        run: |
          git config user.name "Foundry Bot"
          git config user.email "foundry@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "jobs: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
