<title>Foundry Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky bar, six command-centre tabs, then a stack of venture cards for the chosen view. Same foundry-floor look as the map: ink, brass, department colours. */
:root {
  --bg: #101317; --panel: #171c22; --panel-2: #1f262e; --line: #2a323c; --fg: #ece7dd; --muted: #9aa3ad; --accent: #e8a24a; --accent-ink: #1a1206;
  --ok: #7fd1a8; --warn: #e8d35a; --crit: #e06c6c; --info: #5fa8f5;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); padding-block: 0 32px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; min-height: 52px; padding-block: 10px; }
.bar h1 { font: 700 26px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; margin: 0; }
.bar .status { margin-left: auto; font: 12px/1.3 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 14px 10px; }
.tab { font: 600 12px/1 var(--display); letter-spacing: .09em; text-transform: uppercase; border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 3px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tab:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-block: 4px 14px; }
.stat { background: var(--panel); padding: 10px 12px; min-width: 0; }
.stat b { display: block; font: 500 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font: 600 11px/1.6 var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 520px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cards { display: grid; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px; min-width: 0; display: grid; gap: 10px; }
.card.sample { border-style: dashed; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.head h2 { font: 700 22px/1 var(--display); letter-spacing: .02em; margin: 0; text-wrap: balance; }
.pill { font: 600 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.pill.stage { color: var(--info); border-color: var(--info); }
.pill.continue, .pill.scale, .pill.live { color: var(--ok); border-color: var(--ok); }
.pill.park, .pill.pending { color: var(--warn); border-color: var(--warn); }
.pill.kill, .pill.failed { color: var(--crit); border-color: var(--crit); }
.meta { font: 12px/1.4 var(--mono); color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 14px; font-size: 14px; }
.rows dt { font: 600 12px/1.6 var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.rows dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.stages { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.sg { background: var(--panel-2); border-radius: 3px; padding: 6px 4px; text-align: center; min-width: 0; }
.sg span { display: block; font: 600 10px/1.4 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg b { font: 500 13px/1.3 var(--mono); }
.sg.done { outline: 1px solid var(--ok); }
.sg.now { outline: 1px solid var(--accent); }
@media (max-width: 520px) { .stages { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); }
.fill.over { background: var(--crit); }
.spark { width: 100%; height: 56px; display: block; max-width: 100%; }
.empty { border: 1px dashed var(--line); border-radius: 4px; padding: 24px 16px; color: var(--muted); text-align: center; }
.empty b { color: var(--fg); font-family: var(--display); font-size: 18px; letter-spacing: .02em; }
.note { font-size: 13px; color: var(--muted); margin: 0; max-width: 65ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar"><div class="wrap bar-in"><h1>Foundry Radar</h1><span class="status" id="status">Connecting to the store</span></div></header>

<div class="wrap">
  <div class="tabs" id="tabs" role="tablist" aria-label="Command centre"></div>
  <section class="strip" id="strip" aria-label="Summary"></section>
  <p class="note" id="viewnote"></p>
  <main class="cards" id="cards" aria-live="polite"></main>
  <div class="empty" id="empty" hidden><b>No ventures yet.</b><br>Press Deploy on a validated idea in Lodestone. The daily sync carries it to Foundry, the launch workflow audits it, and it appears here.</div>
</div>

<script>
(function () {
  var VIEWS = [
    ["radar", "Radar", "Every venture, its stage and verdict."],
    ["pipeline", "Pipeline", "Sales and Deals: sell stage progress for ventures with a business buyer."],
    ["marketing", "Marketing", "Launch stage: landing page, posts, ad brief, cost per sign-up against the kill rule."],
    ["build", "Build", "Build stage: MVP progress, QA, incidents, skipped jobs."],
    ["customer", "Customer", "Support stage: tickets answered, health, churn flags."],
    ["finance", "Finance", "Run stage: ad budget approved and spent, revenue, weekly verdicts."]
  ];
  var STAGES = ["validate", "clear", "build", "launch", "sell", "support", "run"];
  var state = { view: "radar", ventures: [], db: null };
  try { var v = location.hash.slice(1); if (VIEWS.some(function (x) { return x[0] === v; })) state.view = v; } catch (e) {}

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function gbp(n) { n = Number(n) || 0; return "£" + n.toLocaleString("en-GB", { maximumFractionDigits: 0 }); }
  function when(s) { if (!s) return ""; var d = new Date(s.length === 10 ? s + "T12:00:00Z" : s); return isNaN(d) ? s : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
  function stageCount(v, s) { var x = (v.stages || {})[s] || { total: 0, done: 0 }; return x; }
  function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }

  function row(dl, k, val) { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, val == null || val === "" ? "none yet" : String(val))); }

  function spark(weekly, key) {
    var ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 320 56"); svg.setAttribute("class", "spark"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", key + " by week");
    var vals = weekly.map(function (w) { return Number(w[key]) || 0; });
    if (vals.length < 2) { var t = document.createElementNS(ns, "text"); t.setAttribute("x", "0"); t.setAttribute("y", "34"); t.setAttribute("fill", "var(--muted)"); t.setAttribute("font-size", "12"); t.textContent = "weekly " + key + ": fewer than two weeks recorded"; svg.appendChild(t); return svg; }
    var max = Math.max.apply(null, vals.concat([1])), step = 300 / (vals.length - 1);
    var pts = vals.map(function (v, i) { return (10 + i * step).toFixed(1) + "," + (50 - v / max * 44).toFixed(1); });
    var area = document.createElementNS(ns, "path"); area.setAttribute("d", "M10,50 L" + pts.join(" L") + " L" + (10 + (vals.length - 1) * step).toFixed(1) + ",50 Z"); area.setAttribute("fill", "var(--accent)"); area.setAttribute("opacity", ".15"); svg.appendChild(area);
    var line = document.createElementNS(ns, "polyline"); line.setAttribute("points", pts.join(" ")); line.setAttribute("fill", "none"); line.setAttribute("stroke", "var(--accent)"); line.setAttribute("stroke-width", "2"); svg.appendChild(line);
    var last = pts[pts.length - 1].split(","), dot = document.createElementNS(ns, "circle"); dot.setAttribute("cx", last[0]); dot.setAttribute("cy", last[1]); dot.setAttribute("r", "3.5"); dot.setAttribute("fill", "var(--accent)"); svg.appendChild(dot);
    return svg;
  }

  function card(v) {
    var c = el("article", "card" + (v.sample ? " sample" : "")); c.setAttribute("tabindex", "0");
    var head = el("div", "head");
    head.appendChild(el("h2", null, v.title || v.slug));
    head.appendChild(el("span", "pill stage", v.stage || "validate"));
    head.appendChild(el("span", "pill " + (v.verdict || "pending"), v.verdict || "pending"));
    if (v.sample) head.appendChild(el("span", "pill", "sample"));
    head.appendChild(el("span", "meta", (v.deployed ? "deployed " + when(v.deployed) : "") + (v.updated ? "  updated " + when(v.updated) : "")));
    c.appendChild(head);
    var dl = el("dl", "rows"), last = (v.weekly || []).slice(-1)[0] || {}, b = v.budget || {};
    if (state.view === "radar") {
      var sg = el("div", "stages");
      STAGES.forEach(function (s) { var x = stageCount(v, s), box = el("div", "sg" + (x.total && x.done === x.total ? " done" : s === v.stage ? " now" : "")); box.appendChild(el("span", null, s)); box.appendChild(el("b", null, x.total ? x.done + "/" + x.total : "0")); sg.appendChild(box); });
      c.appendChild(sg);
      row(dl, "business model", v.business_model); row(dl, "jobs done", v.jobs_done + " of " + v.jobs_total); row(dl, "budget", gbp(b.spent) + " of " + gbp(b.ad_budget) + " spent, " + gbp(b.revenue) + " revenue");
    } else if (state.view === "pipeline") {
      var sell = stageCount(v, "sell");
      if (!sell.total) { row(dl, "sell stage", "not part of this launch (consumer product)"); }
      else { row(dl, "sell jobs", sell.done + " of " + sell.total); row(dl, "leads", last.leads); row(dl, "replies", last.replies); row(dl, "meetings", last.meetings); }
    } else if (state.view === "marketing") {
      var la = stageCount(v, "launch");
      row(dl, "launch jobs", la.done + " of " + la.total); row(dl, "sign-ups", v.sign_ups); row(dl, "cost per sign-up", v.cost_per_sign_up == null ? "no spend yet" : gbp(v.cost_per_sign_up)); row(dl, "ad gate", (v.gates || {}).launch);
      c.appendChild(dl); c.appendChild(spark(v.weekly || [], "sign_ups")); return c;
    } else if (state.view === "build") {
      var bu = stageCount(v, "build");
      row(dl, "build jobs", bu.done + " of " + bu.total); row(dl, "build gate", (v.gates || {}).build); row(dl, "incidents", v.incidents); row(dl, "skipped jobs", v.skipped);
    } else if (state.view === "customer") {
      var su = stageCount(v, "support");
      row(dl, "support jobs", su.done + " of " + su.total); row(dl, "tickets", last.tickets); row(dl, "health", last.health); row(dl, "churn flags", last.churn_flags);
    } else {
      row(dl, "ad budget", gbp(b.ad_budget)); row(dl, "spent", gbp(b.spent)); row(dl, "revenue", gbp(b.revenue)); row(dl, "last weekly verdict", last.verdict);
      c.appendChild(dl);
      var tr = el("div", "track"), f = el("div", "fill" + ((b.spent || 0) > (b.ad_budget || 0) ? " over" : "")); f.style.width = Math.min(100, pct(b.spent || 0, b.ad_budget || 1)) + "%"; tr.appendChild(f); c.appendChild(tr);
      c.appendChild(spark(v.weekly || [], "revenue")); return c;
    }
    c.appendChild(dl);
    return c;
  }

  function render() {
    var tabs = document.getElementById("tabs"); tabs.textContent = "";
    VIEWS.forEach(function (vw) { var b = el("button", "tab", vw[1]); b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(state.view === vw[0])); b.addEventListener("click", function () { state.view = vw[0]; try { history.replaceState(null, "", "#" + vw[0]); } catch (e) {} render(); }); tabs.appendChild(b); });
    document.getElementById("viewnote").textContent = VIEWS.filter(function (x) { return x[0] === state.view; })[0][2];
    var vs = state.ventures.slice().sort(function (a, b) { return String(b.updated || "").localeCompare(String(a.updated || "")); });
    var live = vs.filter(function (v) { return v.verdict !== "kill" && v.verdict !== "park"; });
    var spent = vs.reduce(function (n, v) { return n + (Number((v.budget || {}).spent) || 0); }, 0);
    var rev = vs.reduce(function (n, v) { return n + (Number((v.budget || {}).revenue) || 0); }, 0);
    var strip = document.getElementById("strip"); strip.textContent = "";
    [[vs.length, "ventures"], [live.length, "active"], [gbp(spent), "ad spend"], [gbp(rev), "revenue"]].forEach(function (p) { var s = el("div", "stat"); s.appendChild(el("b", null, String(p[0]))); s.appendChild(el("span", null, p[1])); strip.appendChild(s); });
    var cards = document.getElementById("cards"); cards.textContent = "";
    vs.forEach(function (v) { cards.appendChild(card(v)); });
    document.getElementById("empty").hidden = vs.length > 0;
  }

  render();
  function boot() {
    var st = document.getElementById("status");
    if (!(window.claude && window.claude.use)) { st.textContent = "Open in the Claude app to load the store"; return; }
    window.claude.use("db").then(function (db) {
      if (!db) { st.textContent = "Store unavailable in this view"; return; }
      state.db = db;
      db.collection("ventures").onSnapshot(function (snap) {
        state.ventures = snap.docs.filter(function (d) { return d.exists; }).map(function (d) { var o = Object.assign({}, d.data()); o.slug = o.slug || d.id; return o; });
        st.textContent = state.ventures.length + " ventures, store live";
        render();
      }, function (e) { st.textContent = "Feed stopped: " + (e && e.message || ""); });
    });
  }
  boot();
  window.addEventListener("hashchange", function () { var v = location.hash.slice(1); if (VIEWS.some(function (x) { return x[0] === v; })) { state.view = v; render(); } });
})();
</script>
