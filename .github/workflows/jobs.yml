name: jobs

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "venture slug, or all"
        required: false
        default: all
      job:
        description: "one job id, or blank for the next ones in plan order"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: launch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Run jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          SLUG="${{ github.event.inputs.slug || 'all' }}"
          JOB="${{ github.event.inputs.job }}"
          if [ "$SLUG" = "all" ]; then
            python -m foundry.jobs --all
          elif [ -n "$JOB" ]; then
            python -m foundry.jobs --slug "$SLUG" --job "$JOB"
          else
            python -m foundry.jobs --slug "$SLUG"
          fi
          python -m foundry.dashboards

      - name: Commit
        run: |
          git config user.name "Foundry Bot"
          git config user.email "foundry@users.noreply.github.com"
          git add ventures docs/radar-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "jobs: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
