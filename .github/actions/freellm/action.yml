name: FreeLLMAPI router
description: >
  Starts the FreeLLMAPI router (github.com/tashfeenahmed/freellmapi, MIT) in Docker on the runner and hands FREELLM_KEY and
  FREELLM_BASE to the later steps, or, with mode probe, tries one chat and one search through it, or, with mode stats, records the calls it served and stops it. Fails open: any problem
  leaves FREELLM_KEY unset and the job runs as it did before (foundry/freellm.py). Only the keys for platforms Foundry does
  not already call directly are passed in; never a Gemini, Groq, Mistral, OpenRouter, Cloudflare, SambaNova, Claude or
  Anthropic key.
inputs:
  mode:
    description: start (default), probe or stats
    required: false
    default: start
  tavily:
    description: TAVILY_API_KEY (optional)
    required: false
    default: ''
  exa:
    description: EXA_API_KEY (optional)
    required: false
    default: ''
  firecrawl:
    description: FIRECRAWL_API_KEY (optional)
    required: false
    default: ''
  linkup:
    description: LINKUP_API_KEY (optional)
    required: false
    default: ''
  ollama:
    description: OLLAMA_API_KEY (optional)
    required: false
    default: ''
  llm7:
    description: LLM7_API_KEY (optional)
    required: false
    default: ''
  cerebras:
    description: CEREBRAS_API_KEY (optional)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: FreeLLMAPI router
      shell: bash
      continue-on-error: true
      env:
        MODE: ${{ inputs.mode }}
        TAVILY_API_KEY: ${{ inputs.tavily }}
        EXA_API_KEY: ${{ inputs.exa }}
        FIRECRAWL_API_KEY: ${{ inputs.firecrawl }}
        LINKUP_API_KEY: ${{ inputs.linkup }}
        OLLAMA_API_KEY: ${{ inputs.ollama }}
        LLM7_API_KEY: ${{ inputs.llm7 }}
        CEREBRAS_API_KEY: ${{ inputs.cerebras }}
      run: cd "$GITHUB_WORKSPACE" && python3 -m foundry.freellm "${MODE:-start}" || echo "FreeLLMAPI router step failed; the job runs without it"
